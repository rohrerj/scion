<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Deposit Money</title>
</head>

<body>
    {{if .Error}}
    <p style="color:red;">{{.Error}}</p>
    {{end}}
    <h4>Current balance:</h4>
    <p style="color:blue;">
        {{if .Balance}}
        {{.Balance}}
        {{end}}
    </p>
    <form method="POST" action="/asbalance">
        <input name="deposit" type="text">
        <button type="submit">Deposit</button>
    </form>
</body>

</html>
