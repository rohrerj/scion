<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f7fa;
            color: #333;
            min-height: 100vh;
        }

        /* Navigation */

        nav {
            background: #1e293b;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            gap: 20px;
        }

        .nav-right {
            color: white;
            font-size: 0.95rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .logout-link {
            margin-left: 15px;
            color: white;
            text-decoration: none;
        }

        .logout-link:hover {
            text-decoration: underline;
        }

        /* Main card */

        .container {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1,
        h2,
        h3,
        h4 {
            margin-bottom: 20px;
            color: #1e293b;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: 500;
        }

        input {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #dc2626;
            margin-bottom: 15px;
        }

        .success {
            color: #2563eb;
            font-weight: 600;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <nav>
        <div class="nav-left">
            {{if .Username}}
            <a href="/asbalance">Balance</a>
            {{else}}
            <a href="/aslogin">AS Login</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
            {{end}}
        </div>
        {{if .Username}}
        <div class="nav-right">
            👤 {{.Username}}
            <a class="logout-link" href="/logout">Logout</a>
        </div>
        {{end}}
    </nav>

    <div class="container">
        <h2>Login</h2>

        {{if .Error}}
        <p class="error">{{.Error}}</p>
        {{end}}

        <form method="POST" action="/aslogin">
            <label>ISD-AS Number (1-ff00:0:110)</label>
            <input name="username">

            <label>Password</label>
            <input name="password" type="password">

            <button type="submit">Login</button>
        </form>
    </div>

</body>

</html>
