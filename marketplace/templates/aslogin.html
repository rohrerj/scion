<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AS Login</title>
</head>

<body>
    {{if .Error}}
    <p style="color:red;">{{.Error}}</p>
    {{end}}
    <form method="POST" action="/aslogin">
        ISD-AS: <input name="username">
        Password: <input name="password" type="password">
        <button type="submit">Login</button>
    </form>
</body>

</html>
