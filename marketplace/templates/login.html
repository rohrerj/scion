<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>
    <a href="/aslogin">Login as AS</a><br>
    <a href="/login">Login with existing account</a><br>
    <a href="/register">Register new account</a><br>
    <a href="/token">Request new token</a><br>
    <a href="/balance">Check your balance</a><br>
    {{if .Error}}
    <p style="color:red;">{{.Error}}</p>
    {{end}}
    <form method="POST" action="/login">
        User ID: <input name="username">
        Password: <input name="password" type="password">
        <button type="submit">Login</button>
    </form>
</body>

</html>
