<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Token Generation</title>
</head>

<body>
    {{if .Error}}
    <p style="color:red;">{{.Error}}</p>
    {{end}}
    {{if .Token}}
    <h4>Your token:</h4>
    <p>Is User Token: {{.IsUserToken}}</p>
    <p style="color:blue;">{{.Token}}</p>
    {{else}}
    <form method="POST" action="/token">
        <button type="submit">Create new Token</button>
    </form>
    {{end}}

</body>

</html>
